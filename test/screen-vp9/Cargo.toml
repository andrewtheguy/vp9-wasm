# Writes the fixtures that libvpx as ffmpeg drives it cannot: a stream coded
# by screen-vp9 told where the picture changed, as the remotex gateway and
# wlshare code theirs, which libvpx codes with segmentation. Run by
# `bun run fixtures` for the specs in test/fixtures.ts that name it; apart
# from the decoder's workspace, since it builds libvpx's archive in.
[package]
name = "screen-vp9-fixtures"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
screen-vp9 = { git = "https://github.com/andrewtheguy/screen-vp9", tag = "v0.0.12" }

[workspace]
